<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="data:image/png;base64,/vj/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh...">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Školský manažér – ZŠ s MŠ Višňové</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body { background: #f0f2f5; color: #1e293b; }
  /* Universal Modal Container Fix */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-box {
    background: #ffffff;
    border-radius: 12px;
    width: 100%;
    max-width: 650px;
    max-height: calc(100vh - 40px);
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    overflow: hidden;
  }
  .modal-header {
    padding: 16px 24px;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f8fafc;
  }
  .modal-body {
    padding: 24px;
    overflow-y: auto;
    flex: 1;
  }
  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid #e2e8f0;
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    background: #f8fafc;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  function App() {
    const [data, setData] = React.useState(null);
    const [curUser, setCurUser] = React.useState(null);
    const [view, setView] = React.useState('plan');
    const [settingsOpen, setSettingsOpen] = React.useState(false);
    const [toast, setToast] = React.useState(null);

    const showToast = (msg) => {
      setToast(msg);
      setTimeout(() => setToast(null), 3000);
    };

    const saveMeeting = (m) => { showToast('Uložené'); };
    const deleteMeeting = (id) => { showToast('Vymazané'); };
    const saveTask = (t) => { showToast('Úloha uložená'); };
    const deleteTask = (id) => { showToast('Úloha vymazaná'); };
    const saveActivity = (a) => { showToast('Aktivita uložená'); };
    const deleteActivity = (id) => { showToast('Aktivita vymazaná'); };
    const approveActivity = (id) => { showToast('Schválené'); };
    const saveDay = (d) => { showToast('Deň uložený'); };
    const deleteDay = (d) => { showToast('Deň vymazaný'); };
    const publishPlan = () => { showToast('Plán publikovaný'); };
    const markDone = (id) => { showToast('Označené ako hotové'); };
    const changeTaskStatus = (id, st) => { showToast('Stav zmenený'); };
    const saveConfig = (cfg) => { setSettingsOpen(false); showToast('Nastavenia uložené'); };

    return (
      <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
        <nav style={{width:260,background:'#1e293b',color:'#fff',display:'flex',flexDirection:'column'}}>
          <div style={{padding:20,fontSize:18,fontWeight:'bold',borderBottom:'1px solid #334155'}}>
            Školský manažér
          </div>
          <div style={{padding:20,flex:1}}>
            <button onClick={()=>setView('plan')} style={{width:'100%',padding:'10px',background:view==='plan'?'#3b82f6':'transparent',border:'none',color:'#fff',textAlign:'left',borderRadius:6,cursor:'pointer',marginBottom:8}}>Plán aktivít</button>
            <button onClick={()=>setView('pp')} style={{width:'100%',padding:'10px',background:view==='pp'?'#3b82f6':'transparent',border:'none',color:'#fff',textAlign:'left',borderRadius:6,cursor:'pointer',marginBottom:8}}>Poradná porada (PP)</button>
            <button onClick={()=>setView('pr')} style={{width:'100%',padding:'10px',background:view==='pr'?'#3b82f6':'transparent',border:'none',color:'#fff',textAlign:'left',borderRadius:6,cursor:'pointer',marginBottom:8}}>Pedagogická rada (PR)</button>
          </div>
        </nav>

        <main style={{flex:1,overflowY:'auto',padding:22,position:'relative'}}>
          {view==='plan' && <PlanView data={data} curUser={curUser}
            onSaveMeet={saveMeeting} onSaveTask={saveTask} onDeleteTask={deleteTask}
            onSaveAct={saveActivity} onDeleteAct={deleteActivity} onApproveAct={approveActivity}
            onSaveDay={saveDay} onDeleteDay={deleteDay} onPublish={publishPlan} onMarkDone={markDone} onChangeStatus={changeTaskStatus} toast={showToast}/>}
          {view==='pp' && <MeetingView data={data} curUser={curUser} type="PP"
            onSaveMeet={saveMeeting} onDeleteMeet={deleteMeeting} onSaveTask={saveTask} onDeleteTask={deleteTask} onMarkDone={markDone} onChangeStatus={changeTaskStatus} toast={showToast}/>}
          {view==='pr' && <MeetingView data={data} curUser={curUser} type="PR"
            onSaveMeet={saveMeeting} onDeleteMeet={deleteMeeting} onSaveTask={saveTask} onDeleteTask={deleteTask} onMarkDone={markDone} onChangeStatus={changeTaskStatus} toast={showToast}/>}
        </main>

        {settingsOpen && <SettingsModal config={data?.config || {}} onSave={saveConfig} onClose={()=>setSettingsOpen(false)}/>}
        {toast && <div style={{position:'fixed',bottom:20,right:20,background:'#0f172a',color:'#fff',padding:'12px 20px',borderRadius:8,zIndex:2000}}>{toast}</div>}
      </div>
    );
  }

  // Example PlanView incorporating modal with correct classes (.modal-overlay, .modal-box, .modal-header, .modal-body, .modal-footer)
  function PlanView({ onSaveAct }) {
    const [modalOpen, setModalOpen] = React.useState(false);
    const [actName, setActName] = React.useState('');
    const [actDesc, setActDesc] = React.useState('');

    return (
      <div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
          <h2>Plán aktivít</h2>
          <button onClick={()=>setModalOpen(true)} style={{background:'#3b82f6',color:'#fff',border:'none',padding:'10px 16px',borderRadius:6,cursor:'pointer'}}>+ Novú aktivitu</button>
        </div>

        {modalOpen && (
          <div className="modal-overlay" onClick={()=>setModalOpen(false)}>
            <div className="modal-box" onClick={(e)=>e.stopPropagation()}>
              <div className="modal-header">
                <h3>Pridať novú aktivitu</h3>
                <button onClick={()=>setModalOpen(false)} style={{background:'none',border:'none',fontSize:18,cursor:'pointer'}}>✕</button>
              </div>
              <div className="modal-body">
                <div style={{marginBottom:16}}>
                  <label style={{display:'block',marginBottom:6,fontWeight:500}}>Názov aktivity</label>
                  <input type="text" value={actName} onChange={(e)=>setActName(e.target.value)} style={{width:'100%',padding:10,border:'1px solid #cbd5e1',borderRadius:6}} placeholder="Zadajte názov..."/>
                </div>
                <div style={{marginBottom:16}}>
                  <label style={{display:'block',marginBottom:6,fontWeight:500}}>Popis / Podrobnosti</label>
                  <textarea rows="6" value={actDesc} onChange={(e)=>setActDesc(e.target.value)} style={{width:'100%',padding:10,border:'1px solid #cbd5e1',borderRadius:6}} placeholder="Zadajte podrobnosti..."></textarea>
                </div>
                <div style={{marginBottom:16}}>
                  <label style={{display:'block',marginBottom:6,fontWeight:500}}></label>
                  <p style={{color:'#64748b',fontSize:14}}>Všetky ďalšie polia formulára sa teraz pohodlne zmestia do dostupnej výšky okna a scrolujú sa iba tu, bez posúvania celého pozadia stránky.</p>
                </div>
              </div>
              <div className="modal-footer">
                <button onClick={()=>setModalOpen(false)} style={{padding:'8px 16px',background:'#e2e8f0',border:'none',borderRadius:6,cursor:'pointer'}}>Zrušiť</button>
                <button onClick={()=>{ onSaveAct({name:actName}); setModalOpen(false); }} style={{padding:'8px 16px',background:'#3b82f6',color:'#fff',border:'none',borderRadius:6,cursor:'pointer'}}>Uložiť</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  function MeetingView() { return <div>Správa porád</div>; }
  function SettingsModal({onClose}) {
    return (
      <div className="modal-overlay" onClick={onClose}>
        <div className="modal-box" onClick={(e)=>e.stopPropagation()}>
          <div className="modal-header"><h3>Nastavenia</h3><button onClick={onClose}>✕</button></div>
          <div className="modal-body"><p>Obsah nastavení...</p></div>
          <div className="modal-footer"><button onClick={onClose}>Zavrieť</button></div>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

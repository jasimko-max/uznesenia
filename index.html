<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="data:image/png;base64,/vj/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh...">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Školský manažér – ZŠ s MŠ Višňové</title>
<!-- React & Babel CDN -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body { background: #f0f2f5; color: #1e293b; }
  
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-box {
    background: #ffffff;
    border-radius: 12px;
    width: 100%;
    max-width: 650px;
    max-height: calc(100vh - 40px);
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    overflow: hidden;
  }
  .modal-header {
    padding: 16px 24px;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f8fafc;
    flex-shrink: 0;
  }
  .modal-body {
    padding: 24px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
  }
  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid #e2e8f0;
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    background: #f8fafc;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  function App() {
    const [view, setView] = React.useState('plan');
    const [toast, setToast] = React.useState(null);

    const showToast = (msg) => {
      setToast(msg);
      setTimeout(() => setToast(null), 3000);
    };

    return (
      <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
        <nav style={{width:260,background:'#1e293b',color:'#fff',display:'flex',flexDirection:'column'}}>
          <div style={{padding:20,fontSize:18,fontWeight:'bold',borderBottom:'1px solid #334155'}}>
            Školský manažér
          </div>
          <div style={{padding:20,flex:1}}>
            <button onClick={()=>setView('plan')} style={{width:'100%',padding:'10px',background:view==='plan'?'#3b82f6':'transparent',border:'none',color:'#fff',textAlign:'left',borderRadius:6,cursor:'pointer',marginBottom:8}}>Plán aktivít</button>
          </div>
        </nav>

        <main style={{flex:1,overflowY:'auto',padding:22,position:'relative'}}>
          {view==='plan' && <PlanView toast={showToast}/>}
        </main>

        {toast && <div style={{position:'fixed',bottom:20,right:20,background:'#0f172a',color:'#fff',padding:'12px 20px',borderRadius:8,zIndex:2000}}>{toast}</div>}
      </div>
    );
  }

  function PlanView({ toast }) {
    const [modalOpen, setModalOpen] = React.useState(true);
    const [actName, setActName] = React.useState('');
    const [termType, setTermType] = React.useState('datum');

    return (
      <div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
          <h2>Plán práce na mesiac</h2>
          <button onClick={()=>setModalOpen(true)} style={{background:'#10b981',color:'#fff',border:'none',padding:'10px 16px',borderRadius:6,cursor:'pointer'}}>+ Aktivita</button>
        </div>

        {modalOpen && (
          <div className="modal-overlay" onClick={()=>setModalOpen(false)}>
            <div className="modal-box" onClick={(e)=>e.stopPropagation()}>
              <div className="modal-header">
                <h3 style={{fontSize:18,fontWeight:600}}>Pridať aktivitu</h3>
                <button onClick={()=>setModalOpen(false)} style={{background:'none',border:'none',fontSize:18,cursor:'pointer',color:'#64748b'}}>✕</button>
              </div>
              
              <div className="modal-body">
                <div style={{marginBottom:16}}>
                  <label style={{display:'block',marginBottom:6,fontWeight:500,fontSize:14,color:'#334155'}}>Názov aktivity</label>
                  <input type="text" value={actName} onChange={(e)=>setActName(e.target.value)} style={{width:'100%',padding:10,border:'1px solid #cbd5e1',borderRadius:6,fontSize:14}} placeholder="Napr. Exkurzia – Bratislava"/>
                </div>

                <div style={{marginBottom:16}}>
                  <label style={{display:'block',marginBottom:6,fontWeight:500,fontSize:14,color:'#334155'}}>Typ termínu</label>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
                    <button onClick={()=>setTermType('datum')} style={{padding:10,borderRadius:6,border:termType==='datum'?'2px solid #3b82f6':'1px solid #cbd5e1',background:termType==='datum'?'#eff6ff':'#fff',cursor:'pointer',fontWeight:500}}>Dátum</button>
                    <button onClick={()=>setTermType('rozsah')} style={{padding:10,borderRadius:6,border:termType==='rozsah'?'2px solid #3b82f6':'1px solid #cbd5e1',background:termType==='rozsah'?'#eff6ff':'#fff',cursor:'pointer',fontWeight:500}}>Rozsah</button>
                    <button onClick={()=>setTermType('mesiac')} style={{padding:10,borderRadius:6,border:termType==='mesiac'?'2px solid #3b82f6':'1px solid #cbd5e1',background:termType==='mesiac'?'#eff6ff':'#fff',cursor:'pointer',fontWeight:500}}>Mesiac</button>
                  </div>
                </div>

                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
                  <div>
                    <label style={{display:'block',marginBottom:6,fontWeight:500,fontSize:14,color:'#334155'}}>Dátum</label>
                    <input type="text" placeholder="dd. mm. rrrr" style={{width:'100%',padding:10,border:'1px solid #cbd5e1',borderRadius:6,fontSize:14}}/>
                  </div>
                  <div>
                    <label style={{display:'block',marginBottom:6,fontWeight:500,fontSize:14,color:'#334155'}}>Pre koho (trieda)</label>
                    <input type="text" placeholder="9.A, všetci..." style={{width:'100%',padding:10,border:'1px solid #cbd5e1',borderRadius:6,fontSize:14}}/>
                  </div>
                </div>

                <div style={{marginBottom:16}}>
                  <label style={{display:'block',marginBottom:6,fontWeight:500,fontSize:14,color:'#334155'}}>Mesiac plánu</label>
                  <select style={{width:'100%',padding:10,border:'1px solid #cbd5e1',borderRadius:6,fontSize:14,background:'#fff'}}>
                    <option>September 2026</option>
                    <option>Október 2026</option>
                  </select>
                </div>

                <div style={{marginBottom:16}}>
                  <label style={{display:'block',marginBottom:6,fontWeight:500,fontSize:14,color:'#334155'}}>Podrobnosti / Poznámka</label>
                  <textarea rows="4" style={{width:'100%',padding:10,border:'1px solid #cbd5e1',borderRadius:6,fontSize:14}} placeholder="Zadajte doplňujúce informácie..."></textarea>
                </div>
              </div>

              <div className="modal-footer">
                <button onClick={()=>setModalOpen(false)} style={{padding:'10px 16px',background:'#e2e8f0',border:'none',borderRadius:6,cursor:'pointer',fontWeight:500}}>Zrušiť</button>
                <button onClick={()=>{ toast('Aktivita uložená'); setModalOpen(false); }} style={{padding:'10px 16px',background:'#3b82f6',color:'#fff',border:'none',borderRadius:6,cursor:'pointer',fontWeight:500}}>Uložiť aktivitu</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
